[workspace]
members = [
    "crates/oxc-coverage-instrument",
    "crates/oxc-coverage-instrument-cli",
    "crates/oxc-coverage-instrument-napi",
    "crates/oxc-coverage-report",
    "crates/oxc-coverage-reports",
    "crates/oxc-coverage-source-maps",
    "crates/oxc-coverage-types",
    "crates/oxc-coverage-v8",
]
resolver = "3"

[workspace.package]
authors = ["Bart Waardenburg <bart@fallow.tools>"]
edition = "2024"
homepage = "https://github.com/fallow-rs/oxc-coverage-instrument"
keywords = ["oxc", "istanbul", "coverage", "javascript", "typescript"]
license = "MIT"
repository = "https://github.com/fallow-rs/oxc-coverage-instrument"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "warn"                    # No unsafe in this workspace today; lint preserves that
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
tail_expr_drop_order = "warn"

[workspace.lints.clippy]
# Lint groups (priority -1 so individual overrides take precedence)
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Restriction lints, matching Oxc's standard
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
clone_on_ref_ptr = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unused_result_ok = "warn"
allow_attributes_without_reason = "warn"
unimplemented = "warn"
excessive_nesting = "warn"
self_named_module_files = "warn"
rest_pat_in_fully_bound_structs = "warn"

# Extra restriction lints, ported from fallow
empty_drop = "warn"                     # Catch no-op Drop impls
empty_structs_with_brackets = "warn"    # Use `struct Foo;` not `struct Foo {}`
infinite_loop = "warn"                  # Catch infinite loops without break
pathbuf_init_then_push = "warn"         # Use PathBuf::from() directly
pub_underscore_fields = "warn"          # Catch accidentally public _-prefixed fields
non_zero_suggestions = "warn"           # Suggest NonZero types for naturally non-zero values
precedence_bits = "warn"                # Catch bitwise operator precedence mistakes
map_with_unused_argument_over_ranges = "warn" # Use `repeat`/`repeat_with` instead
filetype_is_file = "warn"               # FileType::is_file() misses symlinks; use !is_dir()

# Allow pedantic lints that are too noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
items_after_statements = "allow"
single_match_else = "allow"
if_not_else = "allow"
redundant_closure_for_method_calls = "allow"
similar_names = "allow"
wildcard_imports = "allow"
unnested_or_patterns = "allow"
doc_markdown = "allow"
too_long_first_doc_paragraph = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
option_if_let_else = "allow"
missing_const_for_fn = "allow"
use_self = "allow"

# Cargo group: allow transitive version conflicts we cannot resolve
multiple_crate_versions = "allow"       # indexmap pulls hashbrown 0.16 vs 0.17 transitively

[profile.dev]
debug = false

[profile.test]
debug = false

# Optimize proc-macro crates in dev for faster compilation
[profile.dev.package.serde_derive]
opt-level = 1
[profile.dev.package.napi-derive]
opt-level = 1

# Optimize snapshot testing deps in dev
[profile.dev.package.insta]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
