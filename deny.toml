[advisories]
version = 2

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path-only deps between workspace siblings (e.g. cli/napi referencing the lib
# crate by path) are not real wildcard risks. crates.io deps still require
# explicit version specifiers.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
