[package]
name = "oxc_coverage_types"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
description = "Istanbul-compatible coverage data types (FileCoverage, CoverageMap, etc.) for the oxc-coverage suite"
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
categories = ["development-tools::testing", "data-structures"]

[lints]
workspace = true

[lib]
# No inline `#[test]` units; only doctests live in this crate. Disabling the
# test harness avoids compiling a harness binary that cargo would never run.
test = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
