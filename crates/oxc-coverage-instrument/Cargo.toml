[package]
name = "oxc_coverage_instrument"
version = "0.8.0"
authors.workspace = true
edition.workspace = true
description = "Istanbul-compatible JavaScript/TypeScript coverage instrumentation using the Oxc AST"
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
categories = ["development-tools::testing", "web-programming"]

[lints]
workspace = true

[dependencies]
# Suite crates. Path + version: path for workspace builds, version for
# `cargo publish` so the lib crate can publish standalone from crates.io.
oxc_coverage_types = { path = "../oxc-coverage-types", version = "0.2.2" }
oxc_coverage_source_maps = { path = "../oxc-coverage-source-maps", version = "0.4.0" }
oxc_coverage_v8 = { path = "../oxc-coverage-v8", version = "0.2.0" }
oxc_allocator = "0.126"
oxc_ast = "0.126"
oxc_codegen = "0.126"
oxc_parser = "0.126"
oxc_semantic = "0.126"
oxc_sourcemap = "6.1"
oxc_span = "0.126"
oxc_syntax = "0.126"
oxc_transformer = "0.126"
oxc_traverse = "0.126"
serde_json = "1"
# SHA-256 for the x_fallow_functionMap stable_id formula. Bit-equal to
# fallow-cov-protocol::function_identity_id so the overlay can serve as a
# cross-surface join key in the fallow ecosystem. Pinned to the same major
# the protocol uses (it ships with sha2 = "0.11" as of protocol v0.7.1).
sha2 = "0.11"
# Companion source map crates (fallow-rs/srcmap). Exact-pinned because srcmap is pre-1.0
# and only the parse + composition APIs are stable; bump these explicitly.
srcmap-remapping = "=0.3.7"
srcmap-sourcemap = "=0.3.7"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
insta = { version = "1", features = ["json"] }
serde = { version = "1", features = ["derive"] }

[[bench]]
name = "instrument"
harness = false
