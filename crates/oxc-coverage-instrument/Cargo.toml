[package]
name = "oxc_coverage_instrument"
version = "0.7.1"
authors.workspace = true
edition.workspace = true
description = "Istanbul-compatible JavaScript/TypeScript coverage instrumentation using the Oxc AST"
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
categories = ["development-tools::testing", "web-programming"]

[lints]
workspace = true

[dependencies]
# Suite crates. Path + version: path for workspace builds, version for
# `cargo publish` so the lib crate can publish standalone from crates.io.
oxc_coverage_types = { path = "../oxc-coverage-types", version = "0.2.0" }
oxc_coverage_source_maps = { path = "../oxc-coverage-source-maps", version = "0.2.0" }
oxc_coverage_v8 = { path = "../oxc-coverage-v8", version = "0.2.0" }
oxc_allocator = "0.126"
oxc_ast = "0.126"
oxc_codegen = "0.126"
oxc_parser = "0.126"
oxc_semantic = "0.126"
oxc_sourcemap = "6.1"
oxc_span = "0.126"
oxc_syntax = "0.126"
oxc_transformer = "0.126"
oxc_traverse = "0.126"
serde_json = "1"
# Companion source map crates (fallow-rs/srcmap). Exact-pinned because srcmap is pre-1.0
# and only the parse + composition APIs are stable; bump these explicitly.
srcmap-remapping = "=0.3.6"
srcmap-sourcemap = "=0.3.6"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
insta = { version = "1", features = ["json"] }
serde = { version = "1", features = ["derive"] }

[[bench]]
name = "instrument"
harness = false
