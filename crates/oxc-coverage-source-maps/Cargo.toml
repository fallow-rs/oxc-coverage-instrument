[package]
name = "oxc_coverage_source_maps"
version = "0.5.2"
authors.workspace = true
edition.workspace = true
description = "Istanbul-compatible source-map remap for FileCoverage (port of istanbul-lib-source-maps)"
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
categories = ["development-tools::testing", "web-programming"]

[lints]
workspace = true

[features]
codspeed = ["criterion2/codspeed"]

[lib]
# Inline `#[test]` units live in `tests/`; the lib itself has none, so the
# default `[lib].test = true` would build a harness binary cargo never runs.
test = false

[dependencies]
oxc_coverage_types = { path = "../oxc-coverage-types", version = "0.2.2" }
serde_json = "1"
# Exact-pinned (pre-1.0): bump together with the rest of the srcmap suite.
srcmap-sourcemap = "=0.3.9"

[dev-dependencies]
criterion2 = { version = "3.0.2", default-features = false }
srcmap-generator = "=0.3.8"

[[bench]]
name = "remap"
harness = false
test = false
required-features = ["codspeed"]
