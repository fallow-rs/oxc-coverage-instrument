[package]
name = "oxc_coverage_reports"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "Coverage reporters (text, text-summary, json-summary) for the oxc-coverage suite (port of istanbul-reports)"
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["development-tools::testing"]

[lints]
workspace = true

[dependencies]
oxc_coverage_report = { path = "../oxc-coverage-report", version = "0.1.0" }
oxc_coverage_types = { path = "../oxc-coverage-types", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
