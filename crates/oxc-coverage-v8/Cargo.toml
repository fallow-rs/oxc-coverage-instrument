[package]
name = "oxc_coverage_v8"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
description = "V8 inspector coverage to Istanbul FileCoverage conversion (port of v8-to-istanbul)"
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
categories = ["development-tools::testing", "web-programming"]

[lints]
workspace = true

[features]
codspeed = ["criterion2/codspeed"]

[lib]
# Inline `#[test]` units live in `tests/`; the lib itself has none and the
# doc comments contain no examples, so skip both harnesses.
test = false
doctest = false

[dependencies]
oxc_coverage_types = { path = "../oxc-coverage-types", version = "0.2.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion2 = { version = "3.0.2", default-features = false }

[[bench]]
name = "apply"
harness = false
test = false
required-features = ["codspeed"]
