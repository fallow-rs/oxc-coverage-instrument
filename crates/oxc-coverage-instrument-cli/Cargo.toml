[package]
name = "oxc-coverage-instrument-cli"
version = "0.2.0"
edition = "2024"
description = "CLI for Istanbul-compatible coverage instrumentation using Oxc"
license = "MIT"
publish = false

[lints]
workspace = true

[[bin]]
name = "oxc-coverage-instrument"
path = "src/main.rs"
# Skip rustdoc for the bin so cargo doc does not collide with the lib crate
# `oxc_coverage_instrument` on the dasherized output directory. The bin is a
# thin `main.rs` wrapper with no public API worth documenting.
doc = false

[dependencies]
oxc_coverage_instrument = { path = "../oxc-coverage-instrument" }
serde_json = "1"
