name: Benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/bench.yml'
      - '.github/actions/setup-rust/**'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/bench.yml'
      - '.github/actions/setup-rust/**'
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: CodSpeed simulation (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: instrumentation
            cache_key: instrument
            package: oxc_coverage_instrument
            bench: instrument
          - label: source maps
            cache_key: source-maps
            package: oxc_coverage_source_maps
            bench: remap
          - label: v8 coverage
            cache_key: v8
            package: oxc_coverage_v8
            bench: apply
          - label: napi remap
            cache_key: napi-remap
            package: oxc_coverage_instrument_napi
            bench: remap
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bench-${{ matrix.cache_key }}

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
        with:
          tool: cargo-codspeed@4.7.0

      - name: Build benchmark shard
        env:
          RUSTFLAGS: "-C debuginfo=1 -C strip=none -g --cfg codspeed"
        run: |
          cargo build --release -p ${{ matrix.package }} --bench ${{ matrix.bench }} --features codspeed
          mkdir -p target/codspeed/analysis/${{ matrix.package }}
          mv target/release/deps/${{ matrix.bench }}-* target/codspeed/analysis/${{ matrix.package }}
          rm target/codspeed/analysis/${{ matrix.package }}/*.d

      - name: Run benchmark shard
        uses: CodSpeedHQ/action@c145068895e045cc725ee76fcd2307624b65c3af # v4.17.5
        with:
          mode: simulation
          run: cargo codspeed run ${{ matrix.bench }}
