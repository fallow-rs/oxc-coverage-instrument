name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deny all permissions by default; grant per-job as needed.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          cache-key: check-${{ matrix.os }}

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Run doc-tests
        run: cargo test --workspace --doc

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check

      - name: Check for uncommitted changes
        run: git diff --exit-code

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep 'rust-version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache-key: msrv

      - name: Check MSRV
        run: cargo check --workspace

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: doc

      - name: Check documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --document-private-items

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: crate-ci/typos@5374cbf686e897b15713110e233094e2874de7ef # v1

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: taiki-e/install-action@9b29ffac42f36c4efe76140737435c61cfb92383 # cargo-audit
      - run: cargo audit

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2

  shear:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: taiki-e/install-action@b9da40722b5dc25d162879fdf6a098f2d71926cc # cargo-shear
      - run: cargo shear

  zizmor:
    name: Actions Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - run: uvx zizmor --config .github/zizmor.yml --min-confidence medium --format plain .github/

  napi:
    name: Napi Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: napi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: crates/oxc-coverage-instrument-napi
        run: npm ci || npm install

      - name: Build napi binding
        working-directory: crates/oxc-coverage-instrument-napi
        run: npx napi build --platform

      - name: Run napi tests
        working-directory: crates/oxc-coverage-instrument-napi
        run: node test.mjs

      - name: Run upstream Istanbul spec subset
        run: node scripts/istanbul-upstream-specs.mjs

  napi-wasm:
    # Build the napi binding for wasm32-wasip1-threads and run the full test
    # suite under NAPI_RS_FORCE_WASI=error so the WASI binding is exercised
    # end-to-end on every PR (the `error` value fails fast if the WASI binding
    # cannot be loaded, instead of silently falling back to the native one).
    # Catches regressions that compile against native libc but not against the
    # wasm32 emulated environment.
    name: Napi Test (wasm32-wasi)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: napi-wasm
          targets: wasm32-wasip1-threads

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: crates/oxc-coverage-instrument-napi
        run: npm ci || npm install

      - name: Build wasm32-wasi binding
        working-directory: crates/oxc-coverage-instrument-napi
        run: npx napi build --release --platform --target wasm32-wasip1-threads

      # The optionalDependency `@oxc-coverage-instrument/binding-wasm32-wasi`
      # is pinned at the previously published version; the loader in
      # `coverage-instrument.wasi.cjs` would silently fall back to that
      # package's wasm whenever the freshly-built local artifact is missing,
      # making the wasi job exercise the published code instead of the PR
      # under test. Remove the published wasm so the loader can only use the
      # freshly-built local artifact; if napi build failed to produce it, the
      # loader fails loudly instead of pretending to test the new code.
      - name: Force loader to use freshly-built local wasm
        working-directory: crates/oxc-coverage-instrument-napi
        run: |
          ls -la coverage-instrument.wasm32-wasi*.wasm || true
          rm -f node_modules/@oxc-coverage-instrument/binding-wasm32-wasi/*.wasm

      - name: Run napi tests against wasm binding
        working-directory: crates/oxc-coverage-instrument-napi
        env:
          NAPI_RS_FORCE_WASI: error
        run: node test.mjs

      - name: Report wasm size and enforce ceiling
        working-directory: crates/oxc-coverage-instrument-napi
        # Issue #46 acceptance target: WASM artifact size <2 MB compressed.
        # The ceiling is gated on brotli (the best compressor of the three);
        # baseline at branch-cut was 0.58 MB, leaving ~3.5x headroom for
        # dependency drift before the gate fires.
        env:
          MAX_BROTLI_BYTES: 2097152
        run: |
          ls -lh *.wasm
          raw=$(wc -c < coverage-instrument.wasm32-wasi.wasm)
          gz=$(gzip -9 -c coverage-instrument.wasm32-wasi.wasm | wc -c)
          br=$(brotli -q 11 -c coverage-instrument.wasm32-wasi.wasm | wc -c)
          printf '%-12s%10d  %.2f MB\n' 'raw'    "$raw" "$(echo "scale=2; $raw/1048576" | bc)"
          printf '%-12s%10d  %.2f MB\n' 'gzip -9' "$gz"  "$(echo "scale=2; $gz/1048576"  | bc)"
          printf '%-12s%10d  %.2f MB\n' 'brotli'  "$br"  "$(echo "scale=2; $br/1048576"  | bc)"
          if [ "$br" -gt "$MAX_BROTLI_BYTES" ]; then
            echo "::error::Brotli-compressed wasm size $br exceeds ceiling $MAX_BROTLI_BYTES (~2 MB). Issue #46 acceptance target violated."
            exit 1
          fi

  istanbul-diff:
    # Byte-for-byte diff against istanbul-lib-instrument on the shared
    # conformance fixtures after filtering documented intentional divergences.
    # This catches span-level and counter-shape regressions before they ship.
    name: Istanbul byte diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: istanbul-diff

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install napi deps (brings in istanbul-lib-instrument devDep)
        working-directory: crates/oxc-coverage-instrument-napi
        run: npm ci || npm install

      - name: Build napi binding
        working-directory: crates/oxc-coverage-instrument-napi
        run: npx napi build --platform

      - name: Run istanbul diff
        run: node scripts/istanbul-diff.mjs | tee istanbul-diff.log

      - name: Upload diff log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: istanbul-diff-log
          path: istanbul-diff.log
          if-no-files-found: warn

  vitest-typescript-example:
    # End-to-end smoke for the Vitest TypeScript example: builds the napi
    # binding, runs vitest with the createOxcInstrumenter adapter on a small
    # TypeScript project with zero pre-transform, then verifies the resulting
    # coverage-final.json is keyed by the .ts source path and statementMap
    # entries point at .ts line numbers.
    name: Vitest TypeScript example
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: vitest-typescript

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install napi binding deps
        working-directory: crates/oxc-coverage-instrument-napi
        run: npm ci || npm install

      - name: Build napi binding
        working-directory: crates/oxc-coverage-instrument-napi
        run: npx napi build --release --platform

      - name: Install example deps
        working-directory: examples/vitest-typescript
        run: npm install

      - name: Run vitest with coverage
        working-directory: examples/vitest-typescript
        run: npm run coverage

      - name: Verify coverage targets .ts source
        working-directory: examples/vitest-typescript
        run: npm run verify

  ci-ok:
    name: CI
    if: always()
    needs:
      - check
      - msrv
      - doc
      - typos
      - audit
      - deny
      - shear
      - zizmor
      - napi
      - napi-wasm
      - istanbul-diff
      - vitest-typescript-example
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All checks passed
        run: |
          results='${{ toJSON(needs.*.result) }}'
          for result in $(echo "$results" | jq -r '.[]'); do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::Job failed with result: $result"
              exit 1
            fi
          done
